name: Zing Block0 cache contracts

on:
  pull_request:
    paths:
      - '.github/workflows/zing-block0-cache-contracts.yml'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/zing_h3/**'
      - 'python/sglang/multimodal_gen/runtime/server_args/server_args.py'
      - 'python/sglang/multimodal_gen/runtime/entrypoints/openai/zing_cache_api.py'
      - 'python/sglang/multimodal_gen/runtime/entrypoints/openai/realtime/zing_prefill.py'
      - 'python/sglang/multimodal_gen/test/unit/realtime/test_zing_prefill_api.py'
      - 'python/sglang/multimodal_gen/test/unit/realtime/test_zing_progressive_source_session.py'
      - 'python/sglang/multimodal_gen/test/unit/realtime/zing_cache_fixtures.py'
      - 'python/sglang/multimodal_gen/test/unit/realtime/test_zing*cache*.py'
      - 'python/sglang/multimodal_gen/test/unit/test_zing_kv_pool_runtime.py'
      - 'python/sglang/multimodal_gen/test/unit/test_zing_lynn_startup_warmup.py'
      - 'python/sglang/multimodal_gen/test/unit/test_zing_h3_denoise_graph.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zing-block0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SGLANG_LIGHTWEIGHT_RUNTIME: '1'
  HF_HUB_OFFLINE: '1'
  PYTHONPATH: ${{ github.workspace }}/python
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  block0-cache-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the existing Linux CPU recipe
        run: |
          python -m pip install -r scripts/ci/zing/requirements-torch.txt
          python -m pip install -r scripts/ci/zing/requirements-cpu.txt
      - name: Run cache and pool contracts in two fresh CPU trials
        run: |
          python scripts/ci/zing/run_cpu_tests.py --suite dit-pipeline-contracts --triage --trials 2 --timeout 500 \
            --file python/sglang/multimodal_gen/test/unit/realtime/test_zing_paged_cache.py \
            --file python/sglang/multimodal_gen/test/unit/realtime/test_zing_block0_cache_contract.py \
            --file python/sglang/multimodal_gen/test/unit/realtime/test_zing_preparation_cache.py \
            --file python/sglang/multimodal_gen/test/unit/realtime/test_zing_prompt_switch_cache.py \
            --file python/sglang/multimodal_gen/test/unit/test_zing_kv_pool_runtime.py \
            --file python/sglang/multimodal_gen/test/unit/test_zing_lynn_startup_warmup.py \
            --output-dir artifacts/block0-cache
      - name: Run cached-prefix Graph provider contracts in two CPU trials
        run: |
          for trial in 1 2; do
            python -m pytest -c test/pytest.ini --rootdir=. --strict-config --strict-markers -v \
              python/sglang/multimodal_gen/test/unit/test_zing_h3_denoise_graph.py::test_block0_provider_routes_start_and_prompt_cycle \
              --junitxml="artifacts/block0-cache/prefix-provider-trial-${trial}.xml" \
              > "artifacts/block0-cache/prefix-provider-trial-${trial}.log" 2>&1
          done
      - name: Run prefill and management API contracts in two CPU trials
        run: |
          for trial in 1 2; do
            python -m pytest -c test/pytest.ini --rootdir=. --strict-config --strict-markers -v \
              python/sglang/multimodal_gen/test/unit/realtime/test_zing_prefill_api.py \
              python/sglang/multimodal_gen/test/unit/realtime/test_zing_progressive_source_session.py::test_block0_prefill_and_live_share_key_without_scheduling_policy \
              python/sglang/multimodal_gen/test/unit/realtime/test_zing_progressive_source_session.py::test_dispose_logs_paged_block0_capacity_and_releases_state \
              --junitxml="artifacts/block0-cache/prefill-api-trial-${trial}.xml" \
              > "artifacts/block0-cache/prefill-api-trial-${trial}.log" 2>&1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-block0-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/block0-cache
          if-no-files-found: error
