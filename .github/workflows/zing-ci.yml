name: Zing CPU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zing-cpu-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SGLANG_LIGHTWEIGHT_RUNTIME: '1'
  ZING_FULL_TILE_TESTS: '1'
  HF_HUB_OFFLINE: '1'
  PYTHONPATH: ${{ github.workspace }}/python
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  zing-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_cpu: ${{ steps.select.outputs.run_cpu }}
      selection_artifact_id: ${{ steps.selection-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - id: select
        name: Select from verified base/head Git history
        run: |
          python scripts/ci/zing/select_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"             --event "$GITHUB_EVENT_NAME" --output artifacts/selection.json --github-output "$GITHUB_OUTPUT"
      - id: selection-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-selection-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/selection.json
          if-no-files-found: error
  ci-tooling-contracts:
    # Deliberately independent: no needs or detector/path condition.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the pinned independent tooling environment
        run: python -m pip install -r scripts/ci/zing/requirements-tooling.txt
      - name: Execute the fixed five behavioral contracts
        run: python scripts/ci/zing/run_tooling_tests.py --output-dir artifacts/tooling
      - name: Check business and tooling inventory without executing business
        if: always()
        run: python scripts/ci/zing/run_cpu_tests.py --check-inventory --manifest scripts/ci/zing/cpu_test_manifest.json --output-dir artifacts/inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-tooling-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
  zing-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the pinned check-only Python tools
        run: python -m pip install -r scripts/ci/zing/requirements-tooling.txt
      - name: Check changed files or the complete tree after configuration changes
        run: python scripts/ci/zing/check_python.py --base "$BASE_SHA" --head "$HEAD_SHA" --output artifacts/lint.json
      - name: Validate the new YAML and repository protected job names
        run: |
          python - <<'PYTHON'
          import yaml
          from pathlib import Path
          for path in Path('.github/workflows').glob('zing-*.yml'):
              yaml.safe_load(path.read_text())
          PYTHON
          python scripts/lint/check_workflow_job_names.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-lint-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/lint.json
          if-no-files-found: error
  area-contracts:
    # Current source owners execute independently of historical CPU approvals.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the existing pinned CPU recipe
        run: |
          python -m pip install -r scripts/ci/zing/requirements-torch.txt
          python -m pip install -r scripts/ci/zing/requirements-cpu.txt
          python -m pip install --constraint benchmark/whitebox/requirements.txt av cryptography boto3
      - name: Validate manual release policy and runtime identity
        # Tests only; no production image build, push or regional activation.
        # Reuse the CPU import boundary while exercising real ServerArgs parsing.
        run: python benchmark/zing_h3_causal/run_conditioning_cpu_tests.py deploy/whitebox --confcutdir=deploy/whitebox -q
      - name: Prepare existing media tooling
        run: |
          ffmpeg_bin="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$ffmpeg_bin" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate the maintained gate with real child-process contracts
        run: python -m pytest --confcutdir=test/registered/unit/ci test/registered/unit/ci/test_worldkit_area_gate.py
      - name: Verify Room orphan reaping and signal delivery in CPU containers
        run: |
          docker build --target room-process-init -f docker/whitebox.Dockerfile -t whitebox-room-init-ci .
          python scripts/ci/zing/check_room_init.py --image whitebox-room-init-ci --trials 2 --output artifacts/area-contracts/room-init.json
      - name: Build the exact native sender for source-codec preflight
        # The existing CPU build stage runs bounded Go RTP socket tests before
        # producing the binary; it does not start a deployed service/session.
        run: |
          docker build --target rtc-builder -f docker/whitebox.Dockerfile -t whitebox-rtc-codec-ci .
          rtc_container="$(docker create whitebox-rtc-codec-ci true)"
          trap 'docker rm -f "$rtc_container" > /dev/null' EXIT
          docker cp "$rtc_container:/tmp/whitebox-rtc" "$RUNNER_TEMP/whitebox-rtc"
          echo "WHITEBOX_TEST_RTC_BINARY=$RUNNER_TEMP/whitebox-rtc" >> "$GITHUB_ENV"
      - name: Execute AREA ownership and actual affected CPU consumers twice
        run: python scripts/ci/zing/run_area_tests.py --output-dir artifacts/area-contracts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-area-contracts-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/area-contracts
          if-no-files-found: error
  decoder-contracts:
    needs: [zing-changes]
    if: needs.zing-changes.outputs.run_cpu == 'true'
    uses: ./.github/workflows/zing-cpu-suite.yml
    with:
      suite: decoder-contracts
  adaln-export-contracts:
    needs: [zing-changes]
    if: needs.zing-changes.outputs.run_cpu == 'true'
    uses: ./.github/workflows/zing-cpu-suite.yml
    with:
      suite: adaln-export-contracts
  dit-pipeline-contracts:
    needs: [zing-changes]
    if: needs.zing-changes.outputs.run_cpu == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/zing-cpu-suite.yml
    with:
      suite: dit-pipeline-contracts
      shard-index: ${{ matrix.shard }}
      shard-count: 4
  benchmark-contracts:
    needs: [zing-changes]
    if: needs.zing-changes.outputs.run_cpu == 'true'
    uses: ./.github/workflows/zing-cpu-suite.yml
    with:
      suite: benchmark-contracts
  realtime-contracts:
    needs: [zing-changes]
    if: needs.zing-changes.outputs.run_cpu == 'true'
    uses: ./.github/workflows/zing-cpu-suite.yml
    with:
      suite: realtime-contracts
  conditioning-contracts:
    needs: [zing-changes]
    if: needs.zing-changes.outputs.run_cpu == 'true'
    uses: ./.github/workflows/zing-conditioning-suite.yml
  zing-ci:
    if: always()
    needs: [zing-changes, zing-lint, ci-tooling-contracts, area-contracts, decoder-contracts, adaln-export-contracts, dit-pipeline-contracts, benchmark-contracts, realtime-contracts, conditioning-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.zing-changes.outputs.selection_artifact_id }}
          merge-multiple: true
          path: artifacts
      - name: Require the maintained AREA CPU outcome
        if: always()
        env:
          AREA_RESULT: ${{ needs.area-contracts.result }}
        run: test "$AREA_RESULT" = success
      - name: Require detector, lint, tooling and all selected business outcomes
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/needs.json').write_text(os.environ['NEEDS_JSON'])
          PYTHON
          python scripts/ci/zing/summarize_results.py --selection artifacts/selection.json --needs artifacts/needs.json --event "$GITHUB_EVENT_NAME" --output artifacts/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-summary-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
