name: Zing conditioning CPU contracts

on:
  pull_request:
    paths:
      - .github/workflows/zing-conditioning-cpu.yml
      - python/sglang/multimodal_gen/runtime/conditioning/**
      - python/sglang/multimodal_gen/runtime/server_args/server_args.py
      - python/sglang/multimodal_gen/runtime/entrypoints/openai/realtime/**
      - python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/zing_h3/**
      - python/sglang/multimodal_gen/test/unit/test_zing_*conditioning*.py
      - python/sglang/multimodal_gen/test/unit/conditioning/**
      - python/sglang/multimodal_gen/runtime/pipelines/zing_h3_causal_pipeline.py
      - python/sglang/multimodal_gen/runtime/managers/gpu_worker.py
      - python/sglang/multimodal_gen/runtime/managers/scheduler.py
      - python/sglang/multimodal_gen/runtime/pipelines_core/schedule_batch.py
      - test/registered/unit/multimodal_gen/**
      - benchmark/zing_h3_causal/run_conditioning_cpu_tests.py
      - benchmark/zing_h3_causal/ISSUE_256_CPU_ENVIRONMENT.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CPU contracts for the conditioning RPC, client, worker and realtime adapters.
  # No CUDA kernels, collectives or GPU performance are validated here.
  conditioning-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the baseline commit that test_review_r3 compares against
        run: git fetch --no-tags --depth=1 origin b1899c0bd538a342056a39893e8ce048b17afa32
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned CPU test environment
        run: |
          python - <<'PY'
          import json
          deps = json.load(open("benchmark/zing_h3_causal/ISSUE_256_CPU_ENVIRONMENT.json"))["dependencies"]
          torch = {k: deps[k] for k in ("torch", "torchvision")}
          open("torch.txt", "w").write("".join(f"{k}=={v}\n" for k, v in torch.items()))
          open("deps.txt", "w").write("".join(f"{k}=={v}\n" for k, v in deps.items() if k not in torch))
          PY
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r torch.txt
          python -m pip install -r deps.txt triton==3.8.0
      - name: Run the conditioning CPU suite
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python benchmark/zing_h3_causal/run_conditioning_cpu_tests.py
