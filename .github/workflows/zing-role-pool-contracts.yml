name: Zing role pool contracts
on:
  pull_request:
    paths:
      - 'python/sglang/multimodal_gen/**'
      - 'python/sglang/cli/**'
      - 'deploy/sglang/**'
      - 'benchmark/zing_h3_causal/**'
      - 'scripts/ci/zing/run_role_pool_tests.py'
      - 'scripts/ci/zing/check_worker_pid1.py'
      - 'scripts/ci/zing/requirements-role-pool.txt'
      - 'scripts/ci/zing/prepare_media_tooling.py'
      - '.github/workflows/zing-role-pool-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci/zing/requirements-role-pool.txt
      - name: Install local Redis for transactional tests
        timeout-minutes: 7
        shell: bash
        run: |
          # Bypass the hosted runner's Azure mirror for the Redis install.
          sources="$RUNNER_TEMP/role-pool-ubuntu.list"
          cat > "$sources" <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          apt_options=(-o Dir::Etc::SourceList="$sources" -o Dir::Etc::SourceParts=- -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update --error-on=any
          sudo apt-get "${apt_options[@]}" install -y redis-server
      - name: Run local role-pool contracts
        run: python scripts/ci/zing/run_role_pool_tests.py -q --junitxml=role-pool.xml
      - name: Verify real container PID 1 cleanup deadlines without GPUs
        run: python scripts/ci/zing/check_worker_pid1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-pool-local-contracts
          path: role-pool.xml
