name: Zing TAEH3 CPU contracts

on:
  pull_request:
    paths:
      - .github/workflows/zing-taeh3-cpu.yml
      - python/sglang/multimodal_gen/runtime/models/vaes/taeh3/**
      - python/sglang/multimodal_gen/test/unit/test_zing_h3_taeh3.py
      - python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/zing_h3/**
      - python/sglang/multimodal_gen/configs/pipeline_configs/zing_h3.py
      - benchmark/zing_h3_causal/**
      - python/sglang/multimodal_gen/runtime/utils/realtime_video.py
      - python/sglang/multimodal_gen/runtime/managers/gpu_worker.py
      - python/sglang/multimodal_gen/runtime/entrypoints/openai/realtime/adapters/zing_h3_source_adapter.py
      - python/sglang/multimodal_gen/runtime/entrypoints/openai/realtime/realtime_video_api.py
      - python/sglang/multimodal_gen/runtime/utils/zing_stage_timing.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Model-only coverage: stream partition parity, EOS, reset and isolation.
  # This does not validate pipeline configuration or GPU performance.
  taeh3-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU contract dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==8.4.2 tqdm==4.67.1 pyzmq==26.4.0 numpy==2.2.6 psutil==7.0.0 uvicorn==0.39.0 websockets==15.0.1
          python -m pip freeze
      - name: Check upstream parity and stream lifecycle
        env:
          SGLANG_LIGHTWEIGHT_RUNTIME: '1'
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          # These model-only tests do not need the CUDA runtime conftest.
          cp python/sglang/multimodal_gen/test/unit/test_zing_h3_taeh3.py "$RUNNER_TEMP/test_zing_h3_taeh3.py"
          python -m pytest -q "$RUNNER_TEMP/test_zing_h3_taeh3.py"
      - name: Check bounded cross-dispatch control and evidence contracts
        env:
          SGLANG_LIGHTWEIGHT_RUNTIME: '1'
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m pytest --noconftest -q benchmark/zing_h3_causal/test_cross_dispatch_source.py python/sglang/multimodal_gen/test/unit/test_zing_h3_encoder_worker_admission.py benchmark/zing_h3_causal/tests/test_encoder_overlap_tools.py benchmark/zing_h3_causal/tests/test_slow_consumer_keepalive.py
      - name: Check fixed-payload client and stage timing contracts
        run: |
          python -m pytest -q \
            benchmark/zing_h3_causal/tests/test_bench_client.py \
            benchmark/zing_h3_causal/tests/test_stage_timing.py \
            benchmark/zing_h3_causal/tests/test_analyze_stage_timing.py \
            benchmark/zing_h3_causal/test_whitebox_video_smoke.py \
            benchmark/zing_h3_causal/test_whitebox_six_reference.py
