name: Zing reusable CPU suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      shard-index:
        default: 0
        type: number
      shard-count:
        default: 1
        type: number

permissions:
  contents: read

env:
  SGLANG_LIGHTWEIGHT_RUNTIME: '1'
  ZING_FULL_TILE_TESTS: '1'
  HF_HUB_OFFLINE: '1'
  PYTHONPATH: ${{ github.workspace }}/python
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  cpu-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CPU_SUITE: ${{ inputs.suite }}
      SHARD_INDEX: ${{ inputs.shard-index }}
      SHARD_COUNT: ${{ inputs.shard-count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the pinned Linux CPU recipe
        run: |
          python -m pip install -r scripts/ci/zing/requirements-torch.txt
          python -m pip install -r scripts/ci/zing/requirements-cpu.txt
      - name: Record CPU capabilities
        run: lscpu
      - name: Prepare media tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
      - name: Execute approved CPU contracts with receipt and timeout checks
        run: python scripts/ci/zing/run_cpu_tests.py --manifest scripts/ci/zing/cpu_test_manifest.json --suite "$CPU_SUITE" --trials 2 --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" --output-dir artifacts/cpu-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zing-${{ inputs.suite }}-shard-${{ inputs.shard-index }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/cpu-suite
          if-no-files-found: error
