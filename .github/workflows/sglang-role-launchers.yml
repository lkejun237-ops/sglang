name: SGLang role launchers
on:
  pull_request:
    paths:
      - 'deploy/sglang/**'
      - 'python/sglang/multimodal_gen/runtime/entrypoints/zing_source_encoder_server.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/zing_h3/*_worker.py'
      - '.github/workflows/sglang-role-launchers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  role-launcher-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s deploy/sglang -p 'test_*.py'
