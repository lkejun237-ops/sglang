name: Zing AdaLN CPU contracts

on:
  pull_request:
    paths:
      - .github/workflows/zing-adaln-cpu.yml
      - benchmark/zing_h3_causal/export_checkpoint.py
      - benchmark/zing_h3_causal/SPLIT_ADALN_EXPORT.md
      - test/registered/unit/diffusion/test_zing_adaln_export.py
      - python/sglang/multimodal_gen/configs/pipeline_configs/zing_h3.py
      - python/sglang/multimodal_gen/runtime/models/dits/zing_h3.py
      - python/sglang/multimodal_gen/runtime/pipelines/zing_h3_causal_pipeline.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Conversion coverage only; full-model and CUDA acceptance are separate.
  adaln-export-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU conversion dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==8.4.2 pyyaml==6.0.3 safetensors==0.8.0 numpy==2.2.6
      - name: Check checkpoint conversion contracts
        env:
          SGLANG_LIGHTWEIGHT_RUNTIME: '1'
          PYTHONPATH: ${{ github.workspace }}/python
        run: python -m pytest -q test/registered/unit/diffusion/test_zing_adaln_export.py
